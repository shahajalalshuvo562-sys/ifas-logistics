<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logistics Tracker</title>
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: fleet-office board. Sticky header with a scrolling tab rail, then one working surface per tab:
   a dashboard of summary tiles + action list, or a wide editable table. Road-signage condensed headings. */
:root{
  --bg:#eceee9; --surface:#fafaf7; --field:#ffffff; --ink:#17201d; --mute:#5b6862; --line:#d3d8d1;
  --accent:#0e6a5b; --accent-ink:#ffffff; --head:#1d2a26; --head-ink:#eef3ef; --logo-bg:#ffffff;
  --good:#1d7440; --good-bg:#d8eedd; --warn:#855400; --warn-bg:#fae8b4; --bad:#a3281d; --bad-bg:#f7d6d1;
  --f-head:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'Barlow',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211e; --field:#131a18; --ink:#e5ebe7; --mute:#97a59e; --line:#2a3531;
  --accent:#4fc2ab; --accent-ink:#0a1411; --head:#0c110f; --head-ink:#e5ebe7;
  --good:#72d49c; --good-bg:#17382a; --warn:#f0c35e; --warn-bg:#3a2d0e; --bad:#ff9f92; --bad-bg:#451d19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211e; --field:#131a18; --ink:#e5ebe7; --mute:#97a59e; --line:#2a3531;
  --accent:#4fc2ab; --accent-ink:#0a1411; --head:#0c110f; --head-ink:#e5ebe7;
  --good:#72d49c; --good-bg:#17382a; --warn:#f0c35e; --warn-bg:#3a2d0e; --bad:#ff9f92; --bad-bg:#451d19; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:20}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));background:var(--head);color:var(--head-ink)}
.bar-top{display:flex;align-items:baseline;gap:12px 20px;flex-wrap:wrap;padding-top:12px}
h1{font:700 26px/1 var(--f-head);letter-spacing:.03em;text-transform:uppercase;margin:0}
.sub{color:color-mix(in srgb,var(--head-ink) 65%,transparent);font-size:13px}
.sync{margin-inline-start:auto;font:500 12px var(--f-mono);color:color-mix(in srgb,var(--head-ink) 65%,transparent)}
nav{display:flex;gap:2px;overflow-x:auto;padding-top:10px;scrollbar-width:thin}
nav button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:color-mix(in srgb,var(--head-ink) 70%,transparent);font:600 15px var(--f-head);letter-spacing:.05em;text-transform:uppercase;padding:8px 12px 7px;cursor:pointer}
nav button:hover{color:var(--head-ink)}
nav button[aria-current="page"]{color:var(--head-ink);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{max-width:1500px;margin:0 auto;padding-top:20px}
h2{font:700 22px/1.1 var(--f-head);letter-spacing:.03em;text-transform:uppercase;margin:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:12px}
.head p{margin:2px 0 0;color:var(--mute);font-size:13px;max-width:70ch}
.tools{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;font:600 14px var(--f-body);padding:8px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}
.search,.sm{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:4px;font:14px var(--f-body);padding:7px 10px}
.search{width:200px}
.sm{width:76px}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{position:sticky;top:0;background:var(--surface);text-align:start;font:600 12px var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:9px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
th.calc{color:var(--accent)}
td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
td.n{color:var(--mute);font:12px var(--f-mono);text-align:end;padding-inline-end:8px;width:34px}
.in{width:100%;background:transparent;color:var(--ink);border:1px solid transparent;border-radius:3px;font:inherit;padding:5px 6px}
.in:hover{border-color:var(--line)}
.in:focus{background:var(--field);border-color:var(--accent)}
.mono{font-family:var(--f-mono);font-size:12.5px}
select.in{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:6px}
select.in.good,.calc.good{background:var(--good-bg);color:var(--good);font-weight:600}
select.in.warn,.calc.warn{background:var(--warn-bg);color:var(--warn);font-weight:600}
select.in.bad,.calc.bad{background:var(--bad-bg);color:var(--bad);font-weight:600}
.calc{display:inline-block;padding:4px 8px;border-radius:3px;white-space:nowrap;font-size:13px}
.calc.plain{color:var(--ink);font-family:var(--f-mono);font-size:12.5px}
.del{background:none;border:0;color:var(--mute);cursor:pointer;font-size:12px;padding:5px 6px;border-radius:3px;white-space:nowrap}
.del:hover{color:var(--bad)}
.del.arm{background:var(--bad-bg);color:var(--bad);font-weight:600}
.empty{padding:36px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font:600 18px var(--f-head);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}

/* dashboard */
.rdate{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.rdate input{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:4px;font:14px var(--f-body);padding:6px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
.panel h3{font:700 15px var(--f-head);letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px 14px}
.stat b{display:block;font:700 30px/1 var(--f-head);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--mute)}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.good b{color:var(--good)}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.alist li{display:flex;gap:10px;align-items:baseline;font-size:14px}
.tag{flex:none;font:600 11px var(--f-head);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.ok{color:var(--good);font-weight:600}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
.veh{border:1px solid var(--line);border-radius:5px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.veh .pl{font:500 14px var(--f-mono)}
.veh .dr{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.veh .ft{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font:600 11px var(--f-head);letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--line);color:var(--mute)}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.note{font-size:12.5px;color:var(--mute);margin-top:12px}
.err{background:var(--bad-bg);color:var(--bad);padding:8px 12px;border-radius:4px;margin-bottom:12px;font-size:13px}
.logo{flex:none;align-self:center;background:var(--logo-bg);border-radius:5px;padding:5px 9px;display:flex}
.logo img{display:block;height:34px;width:auto;max-width:100%}
.langbtn{background:transparent;color:var(--head-ink);border:1px solid color-mix(in srgb,var(--head-ink) 40%,transparent);border-radius:4px;font:600 13px var(--f-body);padding:4px 12px;cursor:pointer}
.langbtn:hover{background:color-mix(in srgb,var(--head-ink) 14%,transparent)}
:root[lang="ar"]{--f-body:'Noto Sans Arabic','Barlow',system-ui,sans-serif;--f-head:'Noto Sans Arabic','Barlow Condensed',sans-serif}
:root[lang="ar"] :is(h1,h2,th,.panel h3,nav button,.tag,.chip,.empty b){text-transform:none;letter-spacing:0}
:root[lang="ar"] h1{font-size:24px;line-height:1.2}
:root[lang="ar"] .stat b{font-family:var(--f-head)}
:root[lang="ar"] .mono,:root[lang="ar"] .pl{direction:ltr;text-align:start}
@media (max-width:560px){h1{font-size:22px}.search{width:100%}.tools{margin-inline-start:0;width:100%}}
@media (prefers-reduced-motion:no-preference){.btn,.in{transition:background .12s,border-color .12s}}

.gate{max-width:480px;margin:56px auto;text-align:center;padding:30px 24px}
.gate b{display:block;font:700 22px var(--f-head);letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px}
.gate p{margin:0 0 14px;color:var(--mute)}
.tag.info{background:var(--line);color:var(--mute)}
.v{display:block;padding:5px 6px}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--warn-bg);color:var(--warn);padding:9px 14px;border-radius:4px;margin-bottom:12px;font-size:14px;font-weight:500}
.banner button{background:none;border:1px solid currentColor;color:inherit;border-radius:4px;padding:3px 10px;font:600 13px var(--f-body);cursor:pointer}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.issues li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.issues .wh{font:12px var(--f-mono);color:var(--mute)}
.mini{border-collapse:collapse;font-size:14px}
.mini td,.mini th{padding:4px 18px 4px 0;border-bottom:1px solid var(--line);text-align:start}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


</head>

var AR_DOC={'Registration':'الاستمارة','Insurance':'التأمين','Inspection':'الفحص','Service date':'موعد الصيانة'};
var RULES=[
 [/^Loaded: (.+), (\S+)$/,'تم تحميل: $1، $2'],
 [/^Read from the "(.+)" sheet of your Excel file\. To change anything, edit the file and upload it again\.$/,'مقروء من ورقة "$1" في ملف Excel. لتغيير أي شيء، عدّل الملف ثم ارفعه مرة أخرى.'],

 [/^Could not save: (.*?)\. Reload the page and try again\.$/,'تعذر الحفظ: $1. أعد تحميل الصفحة وحاول مرة أخرى.'],

 [/(Registration|Insurance|Inspection|Service date) expired (\d+) d ago/g,function(m,a,n){return AR_DOC[a]+' انتهى منذ '+n+' يوم'}],
 [/(Registration|Insurance|Inspection|Service date) in (\d+) d/g,function(m,a,n){return AR_DOC[a]+' بعد '+n+' يوم'}],
 [/Service overdue by (\d+) km/g,'الصيانة متأخرة بمقدار $1 كم'],

 [/: (\S+) left$/,': المتبقي $1'],
 [/, (\d+) d overdue$/,'، متأخر $1 يوم']
];
function tr(s){
  var k=s.trim();if(!k)return s;
  var i=s.indexOf(k),lead=s.slice(0,i),trail=s.slice(i+k.length);
  if(Object.prototype.hasOwnProperty.call(AR,k))return lead+AR[k]+trail;
  var r=k;RULES.forEach(function(x){r=r.replace(x[0],x[1])});
  return lead+r+trail}
function trAll(){
  var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:function(n){var p=n.parentNode&&n.parentNode.nodeName;return p==='SCRIPT'||p==='STYLE'?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
  var n,list=[];while((n=w.nextNode()))list.push(n);
  list.forEach(function(n){var v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v});
  document.querySelectorAll('[placeholder],[aria-label],[title]').forEach(function(el){['placeholder','aria-label','title'].forEach(function(a){var v=el.getAttribute(a);if(v){var x=tr(v);if(x!==v)el.setAttribute(a,x)}})})}

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var pad=function(n,l){return String(n).padStart(l||3,'0')};
var today=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)};
var isD=function(s){return /^\d{4}-\d\d-\d\d$/.test(s||'')};
var dnum=function(s){return isD(s)?Math.round(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5):null};
var daysTo=function(s){return isD(s)?dnum(s)-dnum(today()):null};
var num=function(v){return v===''||v==null||isNaN(+v)?null:+v};
var GOOD=['Active','Done','Closed','Delivered','OK','Received','Completed','Yes','Issued to Site','Delivered to Store','Low'];
var WARN=['In Progress','Under Maintenance','Delayed','New','PR Raised','PO Issued','Partial','Reorder','Planned','Dispatched','High','Short','Open','DUE SOON'];
var BAD=['Out of Service','Breakdown','Failed','Overdue','OVERDUE','Out of Stock','Damaged','Wrong Item','Urgent','EXPIRED','No'];
var chip=function(v){return GOOD.indexOf(v)>-1?'good':WARN.indexOf(v)>-1?'warn':BAD.indexOf(v)>-1?'bad':''};

/* ---------- state ---------- */
var S={db:null,data:{},loaded:{},settings:{days:30,km:500},tab:'dashboard',q:'',rdate:today(),err:'',ready:false,pending:false};
S.lang='en';
try{var t=localStorage.getItem('lt-tab');if(t)S.tab=t;if(localStorage.getItem('lt-lang')==='ar')S.lang='ar'}catch(e){}

/* ---------- option lists ---------- */
var O={
  slot:['Start of Day','Morning','Midday','Afternoon','End of Day'],
  cat:['Admin','Maximo','Procurement','Deliveries','Dispatch','Fleet','Inventory','Documentation','Reporting','Planning'],
  pri:['Urgent','High','Medium','Low'],
  tstat:['Pending','In Progress','Done','N/A'],
  vtype:['Pickup','Van','Truck','Car','Bus','Other'],
  vstat:['Active','Under Maintenance','Out of Service'],
  trip:['Completed','In Progress','Delayed','Breakdown','Cancelled'],
  uom:['Each','Box','Set','Meter','Roll','Litre','Kg','Carton'],
  rstat:['New','PR Raised','PO Issued','Delivered to Store','Issued to Site','Closed','Cancelled'],
  cond:['','OK','Damaged','Short','Wrong Item'],
  dstat:['Planned','Dispatched','Delivered','Failed'],
  fstat:['Open','In Progress','Closed'],
  yn:['No','Yes']
};

/* ---------- derived values ---------- */
function fleetBy(){var m={};(S.data.fleet||[]).forEach(function(v){m[v.vid]=v});return m}
function curOdo(v){var o=num(v.odo),best=o;(S.data.trips||[]).forEach(function(t){if(t.vid===v.vid){var e=num(t.end);if(e!=null&&(best==null||e>best))best=e}});return best}
function vAlert(v){
  var d=S.settings.days,k=S.settings.km,ds=[daysTo(v.reg),daysTo(v.ins),daysTo(v.insp),daysTo(v.svc)].filter(function(x){return x!=null});
  var o=curOdo(v),sk=num(v.svc_km),kl=(sk!=null&&o!=null)?sk-o:null;
  if(!ds.length&&kl==null)return{s:'Not set',c:'',why:[]};
  var why=[],bad=false,soon=false;
  [['Registration',daysTo(v.reg)],['Insurance',daysTo(v.ins)],['Inspection',daysTo(v.insp)],['Service date',daysTo(v.svc)]].forEach(function(p){
    if(p[1]==null)return;
    if(p[1]<0){bad=true;why.push(p[0]+' expired '+(-p[1])+' d ago')}else if(p[1]<=d){soon=true;why.push(p[0]+' in '+p[1]+' d')}});
  if(kl!=null){if(kl<0){bad=true;why.push('Service overdue by '+(-kl)+' km')}else if(kl<=k){soon=true;why.push('Service in '+kl+' km')}}
  return bad?{s:'EXPIRED',c:'bad',why:why}:soon?{s:'DUE SOON',c:'warn',why:why}:{s:'OK',c:'good',why:why};
}
function reqOpen(r){return['Issued to Site','Closed','Cancelled'].indexOf(r.status)<0}
function reqLate(r){return reqOpen(r)&&isD(r.required)&&daysTo(r.required)<0}
function poStat(p){var o=num(p.ordered),r=num(p.rqty);
  if(o!=null&&r!=null&&r>=o)return'Received';
  if(isD(p.expected)&&daysTo(p.expected)<0)return'Overdue';
  return r>0?'Partial':'Pending'}
function stStat(s){var q=num(s.qty),m=num(s.min);if(q==null)return'';return q<=0?'Out of Stock':(m!=null&&q<=m)?'Reorder':'OK'}
function fuLate(f){return f.status!=='Closed'&&isD(f.due)&&daysTo(f.due)<0?-daysTo(f.due):0}

/* ---------- table schemas ---------- */

   {k:'pri',l:'Priority',t:'sel',o:O.pri,w:90},{k:'status',l:'Status',t:'sel',o:O.tstat,w:110},{k:'done',l:'Done at',t:'time',w:90},{k:'rem',l:'Remarks',t:'text',w:200}],

   {k:'year',l:'Year',t:'num',w:70},{k:'driver',l:'Driver',t:'text',w:170},{k:'team',l:'Assigned to',t:'text',w:140},{k:'status',l:'Status',t:'sel',o:O.vstat,w:140},
   {k:'reg',l:'Registration expiry',t:'date',w:140},{k:'ins',l:'Insurance expiry',t:'date',w:140},{k:'insp',l:'Inspection expiry',t:'date',w:140},{k:'svc',l:'Next service date',t:'date',w:140},
   {k:'svc_km',l:'Service at (km)',t:'num',w:100},{k:'odo',l:'Opening odometer',t:'num',w:110},
   {k:'_odo',l:'Current odometer',t:'calc',fn:function(r){var o=curOdo(r);return{v:o==null?'':o.toLocaleString(),c:'plain'}}},
   {k:'_al',l:'Alert',t:'calc',fn:function(r){var a=vAlert(r);return{v:a.s,c:a.c,title:a.why.join(', ')}}},
   {k:'_used',l:'Used on report date',t:'calc',fn:function(r){var n=(S.data.trips||[]).filter(function(t){return t.vid===r.vid&&t.date===S.rdate}).length;return{v:n?'Yes':'No',c:n?'good':''}}}],
  add:function(rows){var n=rows.length+1;return{vid:'V-'+pad(n,2),plate:'',type:'Pickup',status:'Active'}}},
 trips:{label:'Vehicle Log',title:'Daily vehicle trip log',blurb:'One row per trip. Choose the vehicle and the driver fills in. The end odometer updates the fleet register.',noun:'trip',
  cols:[
   {k:'date',l:'Date',t:'date',w:130},{k:'vid',l:'Vehicle',t:'vid',w:90},
   {k:'_dr',l:'Driver',t:'calc',fn:function(r){var v=fleetBy()[r.vid];return{v:v?v.driver:'',c:'plain'}}},
   {k:'dest',l:'Site / destination',t:'text',w:150},{k:'purpose',l:'Purpose',t:'text',w:240},{k:'start',l:'Start km',t:'num',w:90},{k:'end',l:'End km',t:'num',w:90},
   {k:'_km',l:'KM driven',t:'calc',fn:function(r){var a=num(r.start),b=num(r.end);return{v:a!=null&&b!=null?(b-a).toLocaleString():'',c:'plain'}}},
   {k:'fuel',l:'Fuel (L)',t:'num',w:80},{k:'dep',l:'Departure',t:'time',w:90},{k:'ret',l:'Return',t:'time',w:90},{k:'status',l:'Status',t:'sel',o:O.trip,w:120}],
  add:function(){return{date:S.rdate,vid:'',status:'Completed'}}},

  return'<td'+w+'><span class="v'+((c.mono||c.t==='vid')?' mono':'')+'">'+esc(v)+'</span></td>'}

function dashHTML(){

  var L=[];

function norm(s){return String(s==null?'':s).replace(/\s+/g,' ').trim().toLowerCase()}
function cDate(v){
  if(v===''||v==null)return{v:''};
  if(v instanceof Date&&!isNaN(v))return{v:v.getFullYear()+'-'+pad(v.getMonth()+1,2)+'-'+pad(v.getDate(),2)};
  if(typeof v==='number'){if(v>20000&&v<80000){var d=new Date(Math.round((v-25569)*864e5));return{v:d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1,2)+'-'+pad(d.getUTCDate(),2)}}return{v:'',bad:true}}
  var s=String(v).trim();if(!s||/^n\/?a$/i.test(s)||s==='-')return{v:''};
  if(isD(s))return{v:s};
  var m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);if(m)return{v:m[3]+'-'+pad(m[2],2)+'-'+pad(m[1],2)};
  return{v:'',bad:true}}
function cNum(v){
  if(v===''||v==null)return{v:''};
  if(typeof v==='number')return{v:v};
  var s=String(v).replace(/,/g,'').trim();if(!s||/^n\/?a$/i.test(s)||s==='-')return{v:''};
  return isNaN(+s)?{v:'',bad:true}:{v:+s}}
function cTime(v){
  if(v===''||v==null)return'';
  if(typeof v==='number'&&v>=0&&v<1){var mi=Math.round(v*1440);return pad(Math.floor(mi/60),2)+':'+pad(mi%60,2)}
  if(v instanceof Date&&!isNaN(v))return pad(v.getHours(),2)+':'+pad(v.getMinutes(),2);
  return String(v).trim()}
function canonMap(coll){
  var m={};(SCH[coll]?SCH[coll].cols:[]).forEach(function(c){if(c.t==='sel'&&c.o){var x={};c.o.forEach(function(o){if(o)x[o.toLowerCase()]=o});m[c.k]=x}});return m}

function importWorkbook(wb){
  var out={},issues=[],sheets=0,skipped=0;
  function add(sev,sheet,row,en,ar){issues.push({sev:sev,sheet:sheet,row:row,en:en,ar:ar})}
  Object.keys(SPEC).forEach(function(coll){
    var sp=SPEC[coll];out[coll]=[];
    var ws=wb.Sheets&&wb.Sheets[sp.sheet];
    if(!ws){add('warn',sp.sheet,'','Sheet "'+sp.sheet+'" was not found in the file.','لم يتم العثور على الورقة "'+sp.sheet+'" في الملف.');return}
    var grid=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:true});
    var keyHeader='';Object.keys(sp.cols).forEach(function(k){if(sp.cols[k]===sp.key)keyHeader=k});
    var hr=-1;for(var i=0;i<Math.min(grid.length,15);i++){if(grid[i].some(function(c){return norm(c)===norm(keyHeader)})){hr=i;break}}
    if(hr<0){add('warn',sp.sheet,'','Header "'+keyHeader+'" was not found in sheet "'+sp.sheet+'".','لم يتم العثور على العنوان "'+keyHeader+'" في الورقة "'+sp.sheet+'".');return}
    sheets++;
    var idx={};grid[hr].forEach(function(c,ci){var n=norm(c);if(n&&idx[n]==null)idx[n]=ci});
    var colIdx={},label={};
    Object.keys(sp.cols).forEach(function(hd){var k=sp.cols[hd],ci=idx[norm(hd)];label[k]=hd;if(ci==null){if(k!=='rem')add('warn',sp.sheet,'','Column "'+hd+'" was not found in sheet "'+sp.sheet+'".','لم يتم العثور على العمود "'+hd+'" في الورقة "'+sp.sheet+'".')}else colIdx[k]=ci});
    var canon=canonMap(coll),isDate={},isNum={},isTime={};
    (sp.date||[]).forEach(function(k){isDate[k]=1});(sp.num||[]).forEach(function(k){isNum[k]=1});(sp.time||[]).forEach(function(k){isTime[k]=1});
    for(var r=hr+1;r<grid.length;r++){
      var row=grid[r],o={_r:r+1,id:coll+'-'+(r+1)};
      if(colIdx.rem!=null&&String(row[colIdx.rem]).toUpperCase().indexOf('EXAMPLE')>-1){skipped++;continue}
      Object.keys(colIdx).forEach(function(k){
        var v=row[colIdx[k]];
        if(isDate[k]){var d=cDate(v);o[k]=d.v;if(d.bad)add('warn',sp.sheet,r+1,'"'+label[k]+'" is not a readable date.','"'+label[k]+'" ليس تاريخاً مقروءاً.')}
        else if(isNum[k]){var n=cNum(v);o[k]=n.v;if(n.bad)add('warn',sp.sheet,r+1,'"'+label[k]+'" is not a number.','"'+label[k]+'" ليس رقماً.')}
        else if(isTime[k])o[k]=cTime(v);
        else{var s=v==null?'':String(v).trim();if(canon[k]&&canon[k][s.toLowerCase()])s=canon[k][s.toLowerCase()];o[k]=s}});
      if(String(o[sp.key]==null?'':o[sp.key])==='')continue;
      out[coll].push(o)}
  });
  if(skipped)add('info','','',skipped+' example row(s) marked EXAMPLE were skipped.',skipped+' من صفوف الأمثلة المعلّمة EXAMPLE تم تجاهلها.');
  validate(out,add);
  return{data:out,issues:issues,sheets:sheets}}

function validate(out,add){
  var F=out.fleet||[],fl={},seen={};
  F.forEach(function(v){
    if(seen[v.vid])add('bad','Fleet',v._r,'Vehicle ID '+v.vid+' appears more than once.','رقم المركبة '+v.vid+' مكرر.');seen[v.vid]=1;fl[v.vid]=1;
    if(!v.plate)add('warn','Fleet',v._r,v.vid+' has no plate number.',v.vid+' بلا رقم لوحة.');
    if(!v.status)add('warn','Fleet',v._r,v.vid+' has no status.',v.vid+' بلا حالة.')});
  var nod=F.filter(function(v){return v.plate&&!v.reg&&!v.ins&&!v.insp&&!v.svc&&v.svc_km===''}).map(function(v){return v.vid});
  if(nod.length)add('info','Fleet','',nod.length+' vehicle(s) have no expiry or service dates, so they cannot raise alerts: '+nod.join(', ')+'.',nod.length+' مركبة بلا تواريخ انتهاء أو صيانة، لذلك لن تظهر لها تنبيهات: '+nod.join('، ')+'.');
  (out.trips||[]).forEach(function(t){
    if(!fl[t.vid])add('bad','Vehicle Log',t._r,'Vehicle '+t.vid+' is not in the Fleet sheet.','المركبة '+t.vid+' غير موجودة في ورقة الأسطول.');
    if(!t.date)add('warn','Vehicle Log',t._r,'This trip has no date.','هذه الرحلة بلا تاريخ.');
    if(t.start!==''&&t.end!==''&&t.end<t.start)add('bad','Vehicle Log',t._r,'End odometer is lower than start odometer.','عداد النهاية أقل من عداد البداية.')});
  [['requests','Material Requests','no'],['pos','PO Deliveries','po'],['dispatch','Site Dispatch','no'],['stock','Inventory','code'],['followups','Follow-ups','ref']].forEach(function(p){
    var s={};(out[p[0]]||[]).forEach(function(r){var k=r[p[2]];if(s[k])add('warn',p[1],r._r,'"'+k+'" appears more than once.','"'+k+'" مكرر.');s[k]=1})});
  (out.requests||[]).forEach(function(r){
    if(r.qty==='')add('warn','Material Requests',r._r,r.no+' has no quantity.',r.no+' بلا كمية.');
    if(r.date&&r.required&&r.required<r.date)add('warn','Material Requests',r._r,r.no+' is required before it was requested.',r.no+' مطلوب قبل تاريخ الطلب.')});
  (out.pos||[]).forEach(function(p){
    if(p.ordered!==''&&p.rqty!==''&&p.rqty>p.ordered)add('warn','PO Deliveries',p._r,p.po+': received quantity is higher than ordered.',p.po+': الكمية المستلمة أكبر من المطلوبة.');
    if(p.rqty!==''&&p.rqty>0&&!p.grn)add('info','PO Deliveries',p._r,p.po+' has received goods but no GRN number.',p.po+' استلام بضاعة بلا رقم إذن استلام.')});
  (out.dispatch||[]).forEach(function(d){
    if(d.vid&&!fl[d.vid])add('bad','Site Dispatch',d._r,'Vehicle '+d.vid+' is not in the Fleet sheet.','المركبة '+d.vid+' غير موجودة في ورقة الأسطول.');
    if(d.status==='Delivered'&&d.signed!=='Yes')add('warn','Site Dispatch',d._r,d.no+' is delivered but the signed delivery note is not marked.',d.no+' تم تسليمه لكن توقيع إذن التسليم غير محدد.')});
  (out.stock||[]).forEach(function(s){if(s.qty!==''&&s.qty<0)add('bad','Inventory',s._r,s.code+' has a negative quantity.',s.code+' كميته سالبة.')});
  (out.followups||[]).forEach(function(f){if(f.date&&f.due&&f.due<f.date)add('warn','Follow-ups',f._r,f.ref+' is due before it was raised.',f.ref+' موعده قبل تاريخ رفعه.')})}

/* ---------- file handling ---------- */
function persist(){try{localStorage.setItem('lt-data',JSON.stringify({file:S.file,data:S.data,issues:S.issues}))}catch(e){}}
function handleFile(f){
  if(!f)return;S.err='';
  if(typeof XLSX==='undefined'){S.err='The Excel reader could not load. Check your internet connection and reload the page.';render();return}
  var rd=new FileReader();
  rd.onerror=function(){S.err='Could not read this file: the browser could not open it.';render()};
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      var res=importWorkbook(wb);
      if(!res.sheets){S.err='Could not read this file: none of the expected sheets were found. Upload the Logistics Tracker workbook.';render();return}
      var d=new Date();
      S.data=res.data;S.issues=res.issues;S.loaded={};Object.keys(res.data).forEach(function(k){S.loaded[k]=true});
      S.file={name:f.name,at:pad(d.getHours(),2)+':'+pad(d.getMinutes(),2)};
      persist();render()
    }catch(e){S.err='Could not read this file: '+((e&&e.message)||'unknown error');render()}};
  rd.readAsArrayBuffer(f)}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.id==='lang'){S.lang=S.lang==='ar'?'en':'ar';try{localStorage.setItem('lt-lang',S.lang)}catch(x){}render();return}
  if(b.id==='upb'||b.dataset.act==='pick'){document.getElementById('file').click();return}
  if(b.dataset.tab){S.tab=b.dataset.tab;S.q='';try{localStorage.setItem('lt-tab',S.tab)}catch(x){}render();window.scrollTo(0,0)}});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='file'){handleFile(el.files&&el.files[0]);el.value='';return}
  if(el.id==='rd'){S.rdate=isD(el.value)?el.value:today();render();return}
  if(el.id==='sd'||el.id==='sk'){var v=Math.max(1,Math.round(+el.value)||1);if(el.id==='sd')S.settings.days=v;else S.settings.km=v;try{localStorage.setItem('lt-set',JSON.stringify(S.settings))}catch(x){}render()}});
document.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;S.refocusQ=true;render()}});
document.addEventListener('dragover',function(e){e.preventDefault()});
document.addEventListener('drop',function(e){e.preventDefault();var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)handleFile(f)});

/* ---------- start ---------- */
S.issues=[];S.file=null;
try{
  var st=JSON.parse(localStorage.getItem('lt-set')||'null');if(st&&st.days)S.settings={days:+st.days||30,km:+st.km||500};
  var sv=JSON.parse(localStorage.getItem('lt-data')||'null');
  if(sv&&sv.file&&sv.data){S.file=sv.file;S.data=sv.data;S.issues=sv.issues||[];Object.keys(sv.data).forEach(function(k){S.loaded[k]=true})}
}catch(e){}
if(S.tab!=='checks'&&!SCH[S.tab])S.tab='dashboard';
window.__LT={importWorkbook:importWorkbook,S:S,dashHTML:dashHTML,tableHTML:tableHTML,checksHTML:checksHTML,render:render};
render();
})();

</script>
